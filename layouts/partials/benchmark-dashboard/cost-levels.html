<div class="benchmarks-dashboard" data-benchmark-dashboard>
  <div class="benchmarks-dashboard__inner">
    <section class="dashboard-panel">
      <div class="dashboard-panel__header">
        <div class="dashboard-panel__title">
          <h2 data-cost-levels-title>Cost of Capability Levels Over Time</h2>
          <span class="dashboard-panel__meta" data-cost-levels-meta></span>
        </div>
      </div>
      <div class="dashboard-chart dashboard-chart--scatter">
        <canvas data-chart="costLevels"></canvas>
        <span class="dashboard-chart__updated" data-chart-updated></span>
      </div>
      <p class="dashboard-empty" data-empty="costLevels" hidden>Need models with both capabilities and cost index values for the current filters.</p>
    </section>
  </div>
</div>
